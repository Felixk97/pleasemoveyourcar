<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening WhatsApp…</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f5f7;margin:0;color:#222}
.card{max-width:430px;margin:40px auto;background:#fff;padding:28px 24px;border-radius:20px;box-shadow:0 8px 28px #0001;text-align:center}
.car{font-size:48px}h1{font-size:22px;margin:8px 0}
.plate{font-size:24px;font-weight:bold;background:#eee;padding:12px;border-radius:10px;margin:16px 0}
a.wa{display:block;padding:15px;border-radius:12px;background:#25d366;color:#fff;font-size:17px;font-weight:bold;text-decoration:none}
.small{font-size:12px;color:#777;line-height:1.45;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="car">🚗</div>
  <h1>Contacting the vehicle owner…</h1>
  <div class="plate" id="plate"></div>
  <a class="wa" id="waLink" href="#">💬 Open WhatsApp</a>
  <div class="small" id="note">If WhatsApp doesn't open automatically, tap the button above. The owner's phone number is not shown.</div>
</div>
<script>
// Owner's WhatsApp username, WITHOUT the @ (e.g. 'felix.cars')
const WA_USERNAME = 'nicolebabooo';

// Default plate; can be overridden with ?plate=XXXX in the link
const params = new URLSearchParams(window.location.search);
const VEHICLE_PLATE = params.get('plate') || 'QAB36D';
document.getElementById('plate').textContent = VEHICLE_PLATE;

if (!WA_USERNAME || WA_USERNAME === 'YOUR_WHATSAPP_USERNAME') {
  document.getElementById('note').textContent = '⚠️ WhatsApp username not set yet. Edit WA_USERNAME in index.html.';
  document.getElementById('waLink').style.display = 'none';
} else {
  const text = 'Hi, I am contacting you about your vehicle ' + VEHICLE_PLATE + '.';
  const url = 'https://wa.me/' + encodeURIComponent(WA_USERNAME) + '?text=' + encodeURIComponent(text);
  document.getElementById('waLink').href = url;
  // Go straight to WhatsApp; the button above is the fallback
  window.location.replace(url);
}
</script>
</body>
</html>
